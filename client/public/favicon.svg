<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Tech Canvas -->
    <linearGradient id="cmBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0b0f19" />
      <stop offset="100%" stopColor="#041f1e" />
    </linearGradient>

    <!-- Neon Emerald to Cyan Cyber Gradient -->
    <linearGradient id="cmAccent" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="35%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <linearGradient id="cmHighlight" x1="16" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#34d399" stopOpacity="0.2" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="cmGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Emerald Stroke -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#cmBg)" stroke="url(#cmAccent)" stroke-width="2" />

  <!-- Modern Grandmaster Knight & AI Motif -->
  <g filter="url(#cmGlow)">
    <!-- Main Knight Body -->
    <path
      d="M17 48h30c1.1 0 2-.9 2-2 0-.8-.5-1.5-1.2-1.8L44.5 43C42.8 36.5 41.5 28.5 44 24.5l-4.5 1.5L41 20l-5 2 1.2-4.5-4-3.5c-.8-.7-2-.7-2.7.1L27 18.5c-.5.5-1.2.7-1.9.5l-6.5-1.8c-1.4-.4-2.7.6-2.9 2-.1.6.1 1.2.4 1.7l3.2 4.6c.4.6.4 1.4 0 2L15.2 33c-.7 1.1-.6 2.5.3 3.5C18.5 39.8 20 42.5 20 46H17c-1.1 0-2 .9-2 2s.9 2 2 2z"
      fill="url(#cmAccent)"
    />

    <!-- Dimensional Inner Shadow / Mane Cut -->
    <path
      d="M33 16l3.5 3.5-1 4.5 4.5-1.5-1.5 5.5 3-1c-2 4.5-1 12.5.5 16H34c-1.5-4-3-8.5-7.5-12.5l2.5-3.5c.6-.8.6-2-.1-2.7l-4.2-4.2 3.8-3.6z"
      fill="#0b0f19"
      fill-opacity="0.3"
    />

    <!-- AI Neural Eye / Diamond Optic -->
    <path
      d="M24.5 25.5l2.5-3.5 2.5 3.5-2.5 3.5z"
      fill="#ffffff"
    />
    <circle cx="27" cy="25.5" r="1.2" fill="#38bdf8" />
  </g>
</svg>